<button id="jf-theme-toggle" type="button" aria-label="Switch color theme">🌙 Dark mode</button><script>(()=>{const k="jibofy-theme";let t="light";try{t=localStorage.getItem(k)||"light"}catch(e){}const b=document.body,btn=document.getElementById("jf-theme-toggle");function apply(){b.classList.toggle("jf-dark",t==="dark");btn.textContent=t==="dark"?"☀️ Light mode":"🌙 Dark mode";btn.setAttribute("aria-pressed",String(t==="dark"))}btn.addEventListener("click",()=>{t=t==="dark"?"light":"dark";try{localStorage.setItem(k,t)}catch(e){}apply()});apply()})();</script>
<header class="top"><div class="brand">JIBOFY <span style="font-size:11px;color:#aebbd0;font-weight:600">ADMIN</span></div><div style="display:flex;gap:8px"><a href="dashboard.html">Member site</a><button id="logout">Sign out</button></div></header>

<script>
(()=>{const db=window.supabase.createClient("https://patuusolvptevgnpdizg.supabase.co","sb_publishable_Yw-qBkZg1T35QTvY7E502w_raeaPHy5");const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let campaigns=[],memberSummaries=[];
async function init(){const {data:{session},error:se}=await db.auth.getSession();if(se||!session){location.replace("account.html");return}const {data:p,error}=await db.from("profiles").select("role").eq("id",session.user.id).single();if(error||p?.role!=="admin"){$("loading").textContent="Access denied. This page is only available to JIBOFY administrators.";return}$("loading").classList.add("hidden");$("app").classList.remove("hidden");async function loadMemberDirectory(){
 $("member-directory").innerHTML='<div class="empty">Loading member summaries…</div>';
 $("member-directory-message").textContent="";
 const [profilesResult,tasksResult,walletResult,withdrawalsResult]=await Promise.all([
  db.from("profiles").select("id,member_code,full_name,phone,email,created_at").order("created_at",{ascending:false}).limit(1000),
  db.from("task_submissions").select("user_id,status").limit(10000),
  db.from("wallet_transactions").select("user_id,amount").limit(10000),
  db.from("withdrawals").select("user_id,amount,status").limit(10000)
 ]);
 const failed=[profilesResult,tasksResult,walletResult,withdrawalsResult].find(x=>x.error);
 if(failed){$("member-directory").innerHTML='<div class="empty">Could not load member summaries: '+esc(failed.error.message)+'</div>';return}
 const tasks=tasksResult.data||[],wallet=walletResult.data||[],withdrawals=withdrawalsResult.data||[];
 memberSummaries=(profilesResult.data||[]).map(p=>{
  const ts=tasks.filter(x=>x.user_id===p.id),ws=wallet.filter(x=>x.user_id===p.id),wr=withdrawals.filter(x=>x.user_id===p.id);
  const earned=ws.reduce((n,x)=>n+Number(x.amount||0),0);
  const withdrawn=wr.filter(x=>String(x.status).toLowerCase()==="paid").reduce((n,x)=>n+Number(x.amount||0),0);
  const reserved=wr.filter(x=>["pending","approved","paid"].includes(String(x.status).toLowerCase())).reduce((n,x)=>n+Number(x.amount||0),0);
  return {...p,totalTasks:ts.length,approvedTasks:ts.filter(x=>x.status==="approved").length,rejectedTasks:ts.filter(x=>x.status==="rejected").length,earned,withdrawn,balance:Math.max(0,earned-reserved)};
 });
 renderMemberDirectory();
}
function renderMemberDirectory(){
 const q=$("member-search").value.trim().toLowerCase();
 const rows=memberSummaries.filter(m=>[m.full_name,m.member_code,m.phone,m.email,m.id].some(v=>String(v||"").toLowerCase().includes(q)));
 if(!rows.length){$("member-directory").innerHTML='<div class="empty">No matching members found.</div>';return}
 $("member-directory").innerHTML=rows.map(m=>'<article class="withdrawal-request"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>'+esc(m.full_name||"Unnamed Member")+'</h3><div class="withdrawal-meta">Member ID: <strong>'+esc(m.member_code||"Not assigned — run Member ID SQL")+'</strong><br>Phone: '+esc(m.phone||"Not added")+'<br>Email: '+esc(m.email||"Not available")+'</div></div><span class="pill">Member</span></div><div class="withdrawal-stats"><div class="withdrawal-stat"><span>Total Tasks</span><strong>'+m.totalTasks+'</strong></div><div class="withdrawal-stat"><span>Task Approved</span><strong>'+m.approvedTasks+'</strong></div><div class="withdrawal-stat"><span>Task Rejected</span><strong>'+m.rejectedTasks+'</strong></div><div class="withdrawal-stat"><span>Total Earned</span><strong>৳'+m.earned.toFixed(2)+'</strong></div><div class="withdrawal-stat"><span>Already Paid</span><strong>৳'+m.withdrawn.toFixed(2)+'</strong></div><div class="withdrawal-stat"><span>Available Balance</span><strong>৳'+m.balance.toFixed(2)+'</strong></div></div><div class="withdrawal-meta">Account UUID: '+esc(m.id)+'</div></article>').join("");
}
$("refresh-members").addEventListener("click",loadMemberDirectory);$("member-search").addEventListener("input",renderMemberDirectory);await loadMemberDirectory();}
$("logout").addEventListener("click",async()=>{await db.auth.signOut();location.replace("account.html")});init();
})();
