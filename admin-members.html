us:30px;padding:5px 9px;background:#26334d;color:#d8ccff;font-size:11px;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:22px;border:1px dashed #ffffff30;border-radius:12px;color:#aebbd0}.note{font-size:12px;color:#8996ad;margin-top:18px;line-height:1.6}.hidden{display:none!important}.withdrawal-request{padding:17px 0;border-bottom:1px solid #ffffff18}.withdrawal-request:last-child{border:0}.withdrawal-request h3{margin:0 0 8px;font-size:16px}.withdrawal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin:12px 0}.withdrawal-stat{background:#0b1426;border:1px solid #ffffff12;border-radius:9px;padding:10px}.withdrawal-stat span{display:block;color:#aebbd0;font-size:11px;margin-bottom:5px}.withdrawal-stat strong{font-size:15px}.withdrawal-meta{font-size:12px;color:#aebbd0;line-height:1.7;overflow-wrap:anywhere}@media(max-width:850px){.grid{grid-template-columns:1fr}}@media(max-width:520px){h1{font-size:29px}.panel{padding:17px}.two{grid-template-columns:1fr}.top{padding:14px}.brand{font-size:19px}}
.withdrawal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin:12px 0}.withdrawal-stat{background:#0b1426;border:1px solid #ffffff12;border-radius:9px;padding:10px}.withdrawal-stat span{display:block;color:#aebbd0;font-size:11px;margin-bottom:5px}.withdrawal-stat strong{font-size:15px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.nav a{padding:11px 15px;border-radius:10px;background:#1b2942;border:1px solid #ffffff20;color:#dbeafe;text-decoration:none;font-size:14px}.nav a.active{background:#6d4bd1;color:#fff;border-color:#9b83ee}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px}.stat-card{background:#151f34;border:1px solid #ffffff18;border-radius:14px;padding:18px}.stat-card span{display:block;color:#aebbd0;font-size:12px;margin-bottom:9px}.stat-card strong{font-size:25px}


/* JIBOFY warm premium refresh — presentation only */
:root{--jf-bg:#f6f7f2;--jf-paper:#fff;--jf-ink:#26352f;--jf-muted:#78857d;--jf-line:#e7ebe4;--jf-sage:#6f927b;--jf-sage-dark:#42634f;--jf-mint:#eaf2eb;--jf-peach:#f7e7dc;--jf-gold:#d9ad65;--jf-shadow:0 8px 26px rgba(39,59,45,.07);--jf-radius:18px}
html{scroll-behavior:smooth}body{background:var(--jf-bg)!important;color:var(--jf-ink)!important;font-family:Inter,"Segoe UI",Arial,sans-serif!important;line-height:1.6}
a{transition:color .18s ease,background .18s ease,border-color .18s ease}.logo,.brand,.footer-brand{color:var(--jf-sage-dark)!important;letter-spacing:.035em}
nav,.nav,.top,.dashboard-top{background:rgba(255,255,255,.94)!important;border-color:var(--jf-line)!important;backdrop-filter:blur(12px);box-shadow:0 3px 16px rgba(39,59,45,.04)}
nav a,.nav a,.top a{color:#52645a!important}nav a:hover,.nav a:hover,.top a:hover{color:var(--jf-sage-dark)!important}
.hero{background:linear-gradient(135deg,#edf4ed 0%,#f8f5ef 100%)!important;border:1px solid #e5ece3!important;border-radius:26px!important}.hero h1,.hero h2,.profile-title{color:#263b30!important}.tag,.eyebrow,.summary-kicker{color:var(--jf-sage-dark)!important}
.card,.panel,.stat,.stat-card,.auth-card,.task,.campaign,.withdrawal-request,.withdrawal-stat,.app-screen,.dialog,.modal,.cta,.features,.dashboard-grid>section{background:var(--jf-paper)!important;border:1px solid var(--jf-line)!important;border-radius:var(--jf-radius)!important;box-shadow:var(--jf-shadow)}
.card:hover,.task:hover,.campaign:hover{border-color:#cbdacb!important;transform:translateY(-2px);transition:transform .2s ease,border-color .2s ease}
.btn,.primary,.start-campaign,.complete-campaign,button.primary{background:var(--jf-sage-dark)!important;color:#fff!important;border:1px solid var(--jf-sage-dark)!important;border-radius:11px!important;font-weight:700!important;box-shadow:0 4px 10px rgba(66,99,79,.12)}
.btn:hover,.primary:hover,.start-campaign:hover,.complete-campaign:hover,button.primary:hover{background:#355540!important;transform:translateY(-1px)}
.btn-secondary,.secondary,button.secondary{background:var(--jf-mint)!important;color:var(--jf-sage-dark)!important;border:1px solid #dce8dd!important;border-radius:11px!important}
.danger{background:#fff0ed!important;color:#a34f45!important;border:1px solid #f3d7d1!important;border-radius:11px!important}
input,select,textarea{background:#fff!important;color:var(--jf-ink)!important;border:1px solid #dfe6de!important;border-radius:10px!important}
input:focus,select:focus,textarea:focus{outline:2px solid #c8ddca!important;border-color:var(--jf-sage)!important}
label,.muted,.sub,.profile-subtitle,.edit-hint,.note,.auth-note{color:var(--jf-muted)!important}.stat strong,.stat-card strong,.reward,.summary-heading{color:var(--jf-sage-dark)!important}
.pill,.state,.filters button{border-radius:999px}.empty,.message,.dash-message{color:var(--jf-muted)}footer{border-color:var(--jf-line)!important}
@media(max-width:700px){nav{height:auto!important;min-height:62px;padding:12px 16px!important;gap:10px;flex-wrap:wrap}nav a{margin:0 8px 0 0!important;font-size:13px!important}.nav{gap:4px!important;padding:8px!important;min-height:60px!important;flex-wrap:wrap}.nav a{min-width:42%!important;max-width:none!important;padding:10px 6px!important;font-size:12px!important}.top{padding:14px 16px!important;flex-wrap:wrap}.dashboard-grid,.stat-grid,.grid,.cards{grid-template-columns:1fr!important}.hero{padding-left:18px!important;padding-right:18px!important}.auth-card,.panel,.card{padding:18px!important}}

</style></head><body>
<header class="top"><div class="brand">JIBOFY <span style="font-size:11px;color:#aebbd0;font-weight:600">ADMIN</span></div><div style="display:flex;gap:8px"><a href="dashboard.html">Member site</a><button id="logout">Sign out</button></div></header>
<main class="wrap"><div class="eyebrow">CONTROL CENTER</div><h1>Member Directory</h1>
<nav class="nav"><a class="" href="admin.html">Overview</a><a class="" href="admin-campaigns.html">Campaigns</a><a class="active" href="admin-members.html">Members</a><a class="" href="admin-withdrawals.html">Withdrawals</a></nav>
<div id="loading" class="empty">Checking administrator access…</div><div id="app" class="hidden"><section class="panel" style="margin-top:22px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<h2 style="margin:0">Member Directory &amp; Earnings</h2>
<button class="btn secondary" id="refresh-members" type="button">Refresh Members</button>
</div>
<p class="muted" style="font-size:13px;margin:8px 0 12px">Search members by name, 8-digit Member ID, phone number or email. Review task counts and wallet balance.</p>
<div class="field"><label for="member-search">Search members</label><input id="member-search" type="search" placeholder="Name, Member ID, phone or email"></div>
<div id="member-directory"><div class="empty">Member list will load here.</div></div>
<div id="member-directory-message" class="message" role="status"></div>
</section></div></main>
<script>
(()=>{const db=window.supabase.createClient("https://patuusolvptevgnpdizg.supabase.co","sb_publishable_Yw-qBkZg1T35QTvY7E502w_raeaPHy5");const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let campaigns=[],memberSummaries=[];
async function init(){const {data:{session},error:se}=await db.auth.getSession();if(se||!session){location.replace("account.html");return}const {data:p,error}=await db.from("profiles").select("role").eq("id",session.user.id).single();if(error||p?.role!=="admin"){$("loading").textContent="Access denied. This page is only available to JIBOFY administrators.";return}$("loading").classList.add("hidden");$("app").classList.remove("hidden");async function loadMemberDirectory(){
 $("member-directory").innerHTML='<div class="empty">Loading member summaries…</div>';
 $("member-directory-message").textContent="";
 const [profilesResult,tasksResult,walletResult,withdrawalsResult]=await Promise.all([
  db.from("profiles").select("id,member_code,full_name,phone,email,created_at").order("created_at",{ascending:false}).limit(1000),
  db.from("task_submissions").select("user_id,status").limit(10000),
  db.from("wallet_transactions").select("user_id,amount").limit(10000),
  db.from("withdrawals").select("user_id,amount,status").limit(10000)
 ]);
 const failed=[profilesResult,tasksResult,walletResult,withdrawalsResult].find(x=>x.error);
 if(failed){$("member-directory").innerHTML='<div class="empty">Could not load member summaries: '+esc(failed.error.message)+'</div>';return}
 const tasks=tasksResult.data||[],wallet=walletResult.data||[],withdrawals=withdrawalsResult.data||[];
 memberSummaries=(profilesResult.data||[]).map(p=>{
  const ts=tasks.filter(x=>x.user_id===p.id),ws=wallet.filter(x=>x.user_id===p.id),wr=withdrawals.filter(x=>x.user_id===p.id);
  const earned=ws.reduce((n,x)=>n+Number(x.amount||0),0);
  const withdrawn=wr.filter(x=>String(x.status).toLowerCase()==="paid").reduce((n,x)=>n+Number(x.amount||0),0);
  const reserved=wr.filter(x=>["pending","approved","paid"].includes(String(x.status).toLowerCase())).reduce((n,x)=>n+Number(x.amount||0),0);
  return {...p,totalTasks:ts.length,approvedTasks:ts.filter(x=>x.status==="approved").length,rejectedTasks:ts.filter(x=>x.status==="rejected").length,earned,withdrawn,balance:Math.max(0,earned-reserved)};
 });
 renderMemberDirectory();
}
function renderMemberDirectory(){
 const q=$("member-search").value.trim().toLowerCase();
 const rows=memberSummaries.filter(m=>[m.full_name,m.member_code,m.phone,m.email,m.id].some(v=>String(v||"").toLowerCase().includes(q)));
 if(!rows.length){$("member-directory").innerHTML='<div class="empty">No matching members found.</div>';return}
 $("member-directory").innerHTML=rows.map(m=>'<article class="withdrawal-request"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>'+esc(m.full_name||"Unnamed Member")+'</h3><div class="withdrawal-meta">Member ID: <strong>'+esc(m.member_code||"Not assigned — run Member ID SQL")+'</strong><br>Phone: '+esc(m.phone||"Not added")+'<br>Email: '+esc(m.email||"Not available")+'</div></div><span class="pill">Member</span></div><div class="withdrawal-stats"><div class="withdrawal-stat"><span>Total Tasks</span><strong>'+m.totalTasks+'</strong></div><div class="withdrawal-stat"><span>Task Approved</span><strong>'+m.approvedTasks+'</strong></div><div class="withdrawal-stat"><span>Task Rejected</span><strong>'+m.rejectedTasks+'</strong></div><div class="withdrawal-stat"><span>Total Earned</span><strong>৳'+m.earned.toFixed(2)+'</strong></div><div class="withdrawal-stat"><span>Already Paid</span><strong>৳'+m.withdrawn.toFixed(2)+'</strong></div><div class="withdrawal-stat"><span>Available Balance</span><strong>৳'+m.balance.toFixed(2)+'</strong></div></div><div class="withdrawal-meta">Account UUID: '+esc(m.id)+'</div></article>').join("");
}
$("refresh-members").addEventListener("click",loadMemberDirectory);$("member-search").addEventListener("input",renderMemberDirectory);await loadMemberDirectory();}
$("logout").addEventListener("click",async()=>{await db.auth.signOut();location.replace("account.html")});init();
})();
</script></body></html>
